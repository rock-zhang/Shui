[package]
name = "shui"
version = "0.4.0"
description = "一个专注喝水提醒的跨端桌面 App，关注打工人健康 💪 ，改善你的喝水习惯。"
authors = ["Slash"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/crates.io/issues/8519
name = "shui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ---------------------------------------------------------------------------
# 平台无关依赖。Android 与桌面共用同一套业务代码（饮水记录 / 统计 / 备份 /
# 提醒会话），只有窗口、托盘、快捷键、自启等外壳被 cfg 隔离。
# ---------------------------------------------------------------------------
[dependencies]
tokio = { version = "1", features = ["full"] }
lazy_static = "1.4.0"
parking_lot = "0.12"
tauri = { version = "2", features = [ "tray-icon", "macos-private-api", "image-ico"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = { version = "0.4", features = ["serde"] }
scopeguard = "1.2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

# ---------------------------------------------------------------------------
# 桌面专属。resolver = "2" 保证 target 专属依赖（含 tauri 的 tray-icon
# feature）不会在 Android 编译时被拉进来。
# ---------------------------------------------------------------------------
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-drag = "2"
tauri-plugin-macos-permissions = "2"
# impl-default 不可省：core/setup/windows.rs 用 MSG::default() 初始化消息结构，
# 该 impl 由 winapi 的 `impl-default` feature 门控。过去它是由已删除的
# tauri-plugin-sql（sqlx 链路）间接启用的，改成显式声明，避免再次被连带移除。
winapi = { version = "0.3", features = [ "impl-default", "wtsapi32", "winuser", "winbase", "libloaderapi", "winnt", "powersetting"] }
widestring = "1.0"
windows = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Power",
] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel.workspace = true
core-foundation = "0.9.4"
core-graphics = "0.23.1"
objc = "0.2.7"          # Objective-C 运行时绑定
objc-foundation = "0.1" # Foundation 框架支持

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.7"
notify-rust = "4.9"
x11-dl = "2.21.0"
gtk = "0.18.1"

[features]
cargo-clippy = []
native-smoke = []
