[package]
name = "shui"
version = "0.5.0"
description = "一个专注喝水提醒的跨端桌面 App，关注打工人健康 💪 ，改善你的喝水习惯。"
authors = ["Slash"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/crates.io/issues/8519
name = "shui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 读取本地 ga4.local.json 并注入编译期环境变量。
serde_json = "1"

# ---------------------------------------------------------------------------
# 平台无关依赖。Android 与桌面共用同一套业务代码（饮水记录 / 统计 / 备份 /
# 提醒会话），只有窗口、托盘、快捷键、自启等外壳被 cfg 隔离。
# ---------------------------------------------------------------------------
[dependencies]
tokio = { version = "1", features = ["full"] }
lazy_static = "1.4.0"
parking_lot = "0.12"
tauri = { version = "2", features = [ "tray-icon", "macos-private-api", "image-ico"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
chrono = { version = "0.4", features = ["serde"] }
# 原生侧本地化：system 语言偏好从系统读取（已在 Cargo.lock 中，0.3.x）。
sys-locale = "0.3"
scopeguard = "1.2"
tauri-plugin-os = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

# ---------------------------------------------------------------------------
# 桌面专属。resolver = "2" 保证 target 专属依赖（含 tauri 的 tray-icon
# feature）不会在 Android 编译时被拉进来。
# ---------------------------------------------------------------------------
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-drag = "2"
tauri-plugin-macos-permissions = "2"
# 桌面端 GA4 Measurement Protocol 上报（Android 走 Firebase 原生 SDK，
# 不需要这两个依赖，所以只在非 Android 目标启用）。
reqwest = { version = "0.13", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
# impl-default 不可省：core/setup/windows.rs 用 MSG::default() 初始化消息结构，
# 该 impl 由 winapi 的 `impl-default` feature 门控。过去它是由已删除的
# tauri-plugin-sql（sqlx 链路）间接启用的，改成显式声明，避免再次被连带移除。
winapi = { version = "0.3", features = [ "impl-default", "wtsapi32", "winuser", "winbase", "libloaderapi", "winnt", "powersetting"] }
widestring = "1.0"
windows = { version = "0.48", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Power",
] }

# 桌面通知由 desktop_notification.rs 直接调 notify-rust，绕开
# plugin-notification 的 JS 通道：Windows 需要 Urgency::Critical（映射成
# Scenario::Reminder 常驻 toast，否则收进通知中心后点击不再上报）、macOS 需要
# actions_label 把折叠下拉的英文 "Options" 改成中文，且动作要在 WebView
# 之外落盘。版本与 plugin-notification 2.8.1 内部依赖保持一致，避免重复编译。
[target.'cfg(windows)'.dependencies]
notify-rust = "4.18"

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 27 起 NSUserNotificationCenter 对 launchd 拉起的 App 不再投递，
# 必须走 UNUserNotificationCenter 后端（notify-rust 的 preview-macos-un）。
notify-rust = { version = "4.18", features = ["preview-macos-un"] }
mac-usernotifications = "0.3.1"
tauri-nspanel.workspace = true
core-foundation = "0.9.4"
core-graphics = "0.23.1"
objc = "0.2.7"          # Objective-C 运行时绑定
objc-foundation = "0.1" # Foundation 框架支持
block = "0.1"           # 把 Rust 闭包包成 ObjC block，用于 UserNotifications 的回调

[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9.7"
notify-rust = "4.9"
x11-dl = "2.21.0"
gtk = "0.18.1"

# ---------------------------------------------------------------------------
# Android 侧载包不引入 Rust 网络栈：HTTPS 下载 / SHA-256 校验全部走 Kotlin
# 的 HttpURLConnection + MessageDigest（系统证书库、无 aws-lc-sys 交叉编译问题）。
# Play 包（默认 feature）也不受影响。
# ---------------------------------------------------------------------------
[features]
cargo-clippy = []
native-smoke = []
# 侧载自更新：仅在 SHUI_VARIANT=sideload 的构建里由 CLI -f 打开。
# 控制 Rust 侧插件注册、command 暴露与下载逻辑；Play 包永不启用。
sideload = []
