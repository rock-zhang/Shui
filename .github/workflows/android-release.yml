name: Android package

# tag v* 与桌面 publish.yaml 并行触发：推一次 tag，桌面 7 个产物 + Android
# Play AAB + 侧载 APK 全部产出。两个流程彼此独立，任一失败不拖垮桌面发布。
# 手动触发保留，用于补跑或本地自测（产物只进 Actions artifact，不上 Release）。
#
# 关键：Play 包与侧载包必须从**独立 runner** 构建。
#  - Play 包：不声明 REQUEST_INSTALL_PACKAGES、不编译自更新 Kotlin、
#    不启用 sideload feature，直接用于上架。
#  - 侧载包：SHUI_VARIANT=sideload + -f sideload，带完整自更新链路。
# 不共用同一个 job 顺序构建两次的原因：Gradle 对同一 task 的 up-to-date
# 判定可能复用上一轮产物，导致 manifest placeholder / Kotlin sourceSet
# 的切换没生效——把 Play 包误带上安装权限是上架级事故，不能赌缓存行为。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      targets:
        description: "ABI 目标，空格分隔（aarch64 armv7 x86_64 i686）"
        required: true
        default: aarch64
        type: string
      signed:
        description: "使用 release keystore（需配置 ANDROID_KEYSTORE_* secrets）"
        required: true
        default: true
        type: boolean
      release_tag:
        description: "手动补跑时把产物上传到哪个 Release tag；留空则只进 Actions artifact"
        required: false
        default: ""
        type: string

permissions:
  contents: write # 上传 APK / AAB 到版本 Release

concurrency:
  group: android-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # 发布密钥只在该环境内可见：可在仓库 Settings → Environments 中为它配置
    # required reviewers 与部署分支限制，避免任意分支改动 workflow 后直接取用
    # secrets。secrets 放到该环境下（同名）时优先于仓库级 secrets。
    environment: production
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: play
            artifact_kind: aab
            cargo_features: ""
          - variant: sideload
            artifact_kind: apk
            cargo_features: sideload
    # push.tags 触发时 inputs 全为空，这里补默认值；手动触发时沿用输入。
    # 手动触发选了单一产物类型时，跳掉不匹配的变体。
    env:
      SHUI_VARIANT: ${{ matrix.variant }}
      ANDROID_TARGETS: ${{ github.event_name == 'push' && 'aarch64' || inputs.targets }}
      ANDROID_SIGNED: ${{ github.event_name == 'push' || inputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-on-failure: true
          # 两个变体的 Rust 产物（feature 不同）分开缓存，避免互相覆盖。
          key: ${{ matrix.variant }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # 默认 packages 含 'tools'，该包已从 SDK 仓库移除，会让 sdkmanager 直接失败；
      # 真正的组件在下一步显式安装。
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.1.12297006" > /dev/null

      - name: Export NDK toolchain
        run: |
          NDK="$ANDROID_HOME/ndk/27.1.12297006"
          test -d "$NDK/toolchains/llvm/prebuilt/linux-x86_64" || { echo "NDK 未安装"; exit 1; }
          {
            echo "NDK_HOME=$NDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "JAVA_HOME=$JAVA_HOME"
          } >> "$GITHUB_ENV"

      # build.gradle.kts 从这四个环境变量读 release signingConfig；
      # 未配置环境变量时会回退 debug 签名（仅可用于本地自测）。
      - name: Decode release keystore
        if: ${{ env.ANDROID_SIGNED == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::缺少 ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS 等 secrets"
            exit 1
          fi
          KS="$GITHUB_WORKSPACE/src-tauri/gen/android/app/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          test -s "$KS" || { echo "::error::keystore 解码失败"; exit 1; }
          {
            echo "ANDROID_KEYSTORE_FILE=$KS"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      # 前端只构建一次：tauri.conf.json 的 beforeBuildCommand 是 yarn build，
      # 这里用内联 config 关掉它，直接复用本步生成的 dist。
      - name: Build frontend once
        run: corepack yarn build

      - name: Build Android artifact
        run: |
          set -euo pipefail
          TARGETS="${{ env.ANDROID_TARGETS }}"
          SKIP_BUILD='{"build":{"beforeBuildCommand":""}}'
          FEATURE_ARGS=""
          if [ -n "${{ matrix.cargo_features }}" ]; then
            FEATURE_ARGS="-f ${{ matrix.cargo_features }}"
          fi
          if [ "${{ matrix.artifact_kind }}" = "aab" ]; then
            corepack yarn tauri android build --aab -t $TARGETS --ci -c "$SKIP_BUILD" $FEATURE_ARGS
          else
            corepack yarn tauri android build --apk -t $TARGETS --ci -c "$SKIP_BUILD" $FEATURE_ARGS
          fi

      # Play 包必须自查不含安装权限——上架红线，宁可构建失败也不能发出去。
      # 校验对象是 Gradle 合并后的 manifest（纯文本，AAB/APK 都从它打包），
      # 比对 AAB 内部的二进制 AXML 更简单可靠。
      - name: Guard Play manifest has no install-packages permission
        if: ${{ matrix.variant == 'play' }}
        run: |
          set -euo pipefail
          MF=$(find src-tauri/gen/android/app/build/intermediates -path '*merged_manifest/*Release/*' -name 'AndroidManifest.xml' | head -1)
          test -n "$MF" || { echo "::error::找不到合并后的 AndroidManifest.xml"; exit 1; }
          echo "检查: $MF"
          if grep -qE 'android:name="android\.permission\.REQUEST_INSTALL_PACKAGES"' "$MF"; then
            echo "::error::Play 包含 REQUEST_INSTALL_PACKAGES，上架会被拒；检查 SHUI_VARIANT 是否被误设为 sideload"
            exit 1
          fi
          echo "Play merged manifest 未发现 REQUEST_INSTALL_PACKAGES ✓"

      # 反向校验：侧载包必须确实带上了安装权限，否则自更新会静默失效。
      - name: Guard sideload manifest has install-packages permission
        if: ${{ matrix.variant == 'sideload' }}
        run: |
          set -euo pipefail
          MF=$(find src-tauri/gen/android/app/build/intermediates -path '*merged_manifest/*Release/*' -name 'AndroidManifest.xml' | head -1)
          test -n "$MF" || { echo "::error::找不到合并后的 AndroidManifest.xml"; exit 1; }
          echo "检查: $MF"
          if ! grep -qE 'android:name="android\.permission\.REQUEST_INSTALL_PACKAGES"' "$MF"; then
            echo "::error::侧载包缺少 REQUEST_INSTALL_PACKAGES，自更新无法安装；检查 SHUI_VARIANT=sideload 是否生效"
            exit 1
          fi
          echo "侧载 merged manifest 已包含 REQUEST_INSTALL_PACKAGES ✓"

      # jarsigner / keytool 对未签名 AAB 也会返回 0，只靠文字描述区分，
      # 因此直接查 META-INF 里的 v1 签名块 + 证书 DN，跨 locale 才可靠。
      - name: Verify AAB is signed with the release key
        if: ${{ matrix.variant == 'play' && env.ANDROID_SIGNED == 'true' }}
        run: |
          AAB=$(find src-tauri/gen/android/app/build/outputs -name '*.aab' | head -1)
          if [ -z "$AAB" ]; then echo "::error::未生成 AAB"; exit 1; fi
          unzip -l "$AAB" | grep -qE 'META-INF/.*\.(RSA|DSA|EC|SF)' || {
            echo "::error::AAB 缺少签名块，Play 会拒绝；检查 ANDROID_KEYSTORE_* secrets"
            exit 1
          }
          CERT=$(keytool -printcert -jarfile "$AAB" 2>&1)
          if echo "$CERT" | grep -qiE 'Android Debug|CN=Android Debug'; then
            echo "::error::AAB 仍是 debug 签名；检查 build.gradle.kts 的 release signingConfig"
            exit 1
          fi
          echo "$CERT" | head -8

      - name: Collect artifacts
        run: |
          mkdir -p android-artifacts
          if [ "${{ matrix.artifact_kind }}" = "aab" ]; then
            find src-tauri/gen/android/app/build/outputs -type f -name '*.aab' -exec cp {} android-artifacts/ \;
          else
            find src-tauri/gen/android/app/build/outputs -type f -name '*.apk' -exec cp {} android-artifacts/ \;
          fi
          ls -lh android-artifacts

      # 侧载包生成版本清单供客户端自更新：{ version, notes, apkUrl, sha256 }，
      # 与 Rust sideload_update::MANIFEST_URL 的 JSON 结构对齐。
      - name: Generate sideload update manifest
        if: ${{ matrix.variant == 'sideload' }}
        run: |
          set -euo pipefail
          APK=$(find android-artifacts -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::未生成 APK"; exit 1; }
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="${{ inputs.release_tag || github.ref_name }}"
          APK_NAME=$(basename "$APK")
          node -e '
            const fs = require("fs");
            const [version, sha, tag, name] = process.argv.slice(1);
            const json = {
              version,
              notes: "",
              apkUrl: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${name}`,
              sha256: sha,
            };
            fs.writeFileSync("android-artifacts/android-latest.json", JSON.stringify(json, null, 2));
            console.log(json);
          ' "$VERSION" "$SHA" "$TAG" "$APK_NAME"

      - name: Remove keystore
        if: always()
        run: rm -f src-tauri/gen/android/app/release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.variant }}-${{ github.run_id }}
          path: android-artifacts/
          if-no-files-found: error
          retention-days: 14

      # 只在 tag 触发时挂到版本 Release（draft 也可上传）。
      # publish.yaml 的 updater.mjs 按 .sig / 安装包名过滤，APK / AAB
      # 不会混进 latest.json 的桌面更新清单。
      - name: Upload to GitHub Release
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${TARGET_TAG}"
          echo "target release: $TAG"
          for f in android-artifacts/*; do
            [ -f "$f" ] || continue
            echo "uploading $(basename "$f") -> $TAG"
            gh release upload "$TAG" "$f" --clobber --repo "$GITHUB_REPOSITORY"
          done
