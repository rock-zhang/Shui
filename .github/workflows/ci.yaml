name: Regression tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      # 4 处版本号必须一致：cargo build --locked 会因 Cargo.lock 没同步而直接失败
      - run: node scripts/version.mjs check
      - run: corepack yarn install --frozen-lockfile
      - run: if [ -d tests ]; then node --test tests/*.test.cjs; fi
      - run: corepack yarn eslint -c src/eslint.config.mjs src
      - run: corepack yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist
          retention-days: 3

  rust:
    name: Native tests (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libx11-dev xvfb openbox dbus-x11 xdotool wmctrl
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-on-failure: true
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      # --no-fail-fast：一次跑完所有测试，避免第一个失败就中断、掩盖后面的问题。
      # 输出落盘，失败时再由下一步压成 annotation —— Actions 日志下载要仓库
      # admin 权限，排障时只能靠 annotation 里的这几行。
      - name: Run tests
        shell: bash
        env:
          # CI 里 cargo 会带 ANSI 颜色码，行首 `^error` 一类锚定会失效。
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          cargo test --workspace --locked --no-fail-fast 2>&1 | tee cargo-test.log
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          echo "===== 最后 80 行 ====="
          tail -80 cargo-test.log || true
          echo "===== 关键行 ====="
          grep -aE "FAILED|panicked at|assertion|error\[E[0-9]+\]|could not compile|^error:" cargo-test.log | head -40 || true
          grep -aE "^(test .* FAILED|error:)" cargo-test.log | head -15 | sed 's/^/::error::/' || true
      - name: Build the default application
        run: cargo build --workspace --locked --features tauri/custom-protocol
      - name: Native startup smoke (macOS / Windows)
        if: runner.os != 'Linux'
        run: python tests/native/startup_smoke.py --build --artifacts artifacts/native-smoke
      - name: Native startup smoke (Linux X11)
        if: runner.os == 'Linux'
        env:
          GDK_BACKEND: x11
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1024x24' python tests/native/startup_smoke.py --build --window-manager openbox --artifacts artifacts/native-smoke
      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-${{ matrix.os }}
          path: artifacts/native-smoke
          if-no-files-found: ignore
          retention-days: 7

  # Android 的 Rust 侧按 target 隔离了桌面插件；这条门禁保证以后改动不会
  # 悄悄把 desktop-only crate 混回移动目标。完整 APK/AAB 由 android-release.yml 产出。
  android-check:
    name: Android cross-compile (aarch64)
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: corepack enable
      - run: corepack yarn install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          cache-on-failure: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # 默认 packages 含 'tools'，该包已从 SDK 仓库移除，会让 sdkmanager 直接失败；
      # 真正的组件在下一步显式安装。
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.1.12297006" > /dev/null
      - name: Export NDK toolchain paths
        run: |
          NDK="$ANDROID_HOME/ndk/27.1.12297006"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$TC/bin/aarch64-linux-android24-clang" || { echo "NDK clang 不存在: $TC"; exit 1; }
          {
            echo "NDK_HOME=$NDK"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "CC_aarch64_linux_android=$TC/bin/aarch64-linux-android24-clang"
            echo "CXX_aarch64_linux_android=$TC/bin/aarch64-linux-android24-clang++"
            echo "AR_aarch64_linux_android=$TC/bin/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TC/bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Cross-compile Rust for Android
        run: cargo check --locked --target aarch64-linux-android --manifest-path src-tauri/Cargo.toml
